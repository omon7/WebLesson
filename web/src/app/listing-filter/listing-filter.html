<form class="filter" (submit)="$event.preventDefault()">
  <label>
    Район
<select
  [value]="districtId() ?? ''"
  (change)="onDistrict($event)"
  id="districtId"
  name="districtId">
        <option value="">Все районы</option>
      @for (d of districts(); track d.id) {
        <option [value]="d.id">{{ d.name }}</option>
      }
    </select>
    
  </label>

  <label>
    Цена до, у.е.
    <input
      type="number"
      min="0"
      step="1000"
      placeholder="любая"
      [value]="maxPrice() ?? ''"
      (input)="onPrice($event)"
      id="maxPrice" name="maxPrice"
    />
  </label>

  <button type="button" (click)="reset()">Сбросить</button>
</form>
