
<article class="card" [class.active]="active()" (click)="choose()">
  <header>
    <h3>{{ listing().title }}</h3>

    <div class="badges">
      @if (isCheap()) {
        <span class="badge">выгодно</span>
      }

      @if (isNew()) {
        <span class="badge new-badge">новое</span>
      }

      <button
        type="button"
        class="favorite-button"
        [class.is-favorite]="favorite()"
        [attr.aria-pressed]="favorite()"
        [attr.aria-label]="favorite() ? 'Убрать из избранного' : 'Добавить в избранное'"
        (click)="toggleFavorite($event)">
        {{ favorite() ? '★' : '☆' }}
      </button>
    </div>
  </header>

  <p class="muted">
    {{ listing().districtName }} · {{ roomsLabel() }}
  </p>

  <p class="price">
    {{ listing().price | number:'1.0-0' }} у.е.
  </p>

  <footer class="muted">
    <time [attr.datetime]="listing().createdAt">
      {{ listing().createdAt | date:'d MMM yyyy' }}
    </time>

    <button
      type="button"
      (click)="choose(); $event.stopPropagation()">
      Подробнее
    </button>
  </footer>
</article>
