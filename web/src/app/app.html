<div class="container">
  <h1>Объявления о квартирах</h1>
@if (error()) {
  <p class="error">{{ error() }}</p>
}
  <div class="listings">
    @for (listing of listings(); track listing.id) {
      <div class="card">
        <h2>{{ listing.title }}</h2>
        <p>Цена: {{ listing.price }} $</p>
      </div>
    }
  </div>
</div>
